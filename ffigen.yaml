# Regenerates lib/src/engine/native/onnx_runtime_bindings.dart.
#
#   dart run ffigen --config ffigen.yaml
#
# The header comes from the ONNX Runtime C pod archive pinned in
# doc/onnx-runtime.md; `tool/fetch_onnxruntime.sh` puts it in third_party/.
#
# Only the handful of C entry points this package calls are generated. `OrtApi`
# itself has to come out in full: it is a table of function pointers, and the
# offset of every member is part of the ABI, so a truncated struct would call
# the wrong function.
name: OrtBindings
description: Minimal dart:ffi bindings to the ONNX Runtime C API.
output: 'lib/src/engine/native/onnx_runtime_bindings.dart'
llvm-path:
  - '/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib'
  - '/usr/lib/llvm-14/lib'
  - '/opt/homebrew/opt/llvm/lib'
headers:
  entry-points:
    - 'third_party/onnxruntime/include/onnxruntime_c_api.h'
  include-directives:
    - '**onnxruntime_c_api.h'
functions:
  include:
    - 'OrtGetApiBase'
    - 'OrtSessionOptionsAppendExecutionProvider_CPU'
structs:
  include:
    - 'OrtApi'
    - 'OrtApiBase'
    - 'OrtCUDAProviderOptions'
    - 'OrtROCMProviderOptions'
    - 'OrtTensorRTProviderOptions'
    - 'OrtMIGraphXProviderOptions'
    - 'OrtOpenVINOProviderOptions'
    - 'OrtCustomOp'
    - 'OrtAllocator'
    - 'OrtTrainingApi'
    - 'OrtModelEditorApi'
    - 'OrtCompileApi'
    - 'OrtEpApi'
enums:
  include:
    - 'ONNXTensorElementDataType'
    - 'ONNXType'
    - 'OrtErrorCode'
    - 'GraphOptimizationLevel'
    - 'ExecutionMode'
    - 'OrtLoggingLevel'
    - 'OrtAllocatorType'
    - 'OrtMemType'
    - 'OrtLanguageProjection'
unnamed-enums:
  include:
    - 'ORT_API_VERSION'
macros:
  include:
    - 'ORT_API_VERSION'
typedefs:
  include:
    - 'OrtStatusPtr'
preamble: |
  // ignore_for_file: type=lint, unused_field, unused_element, camel_case_types
  // ignore_for_file: non_constant_identifier_names, constant_identifier_names
  // ignore_for_file: public_member_api_docs, always_specify_types
comments:
  style: any
  length: brief
